<script>

async function copiarMensaje(){

const boton=document.getElementById("boton");

try{

const respuesta=await fetch("https://raw.githubusercontent.com/JuliethOlaya/centro-formacion-jo/main/mensaje-bienvenida.txt");

const texto=await respuesta.text();

// Primer intento (API moderna)
try{
    await navigator.clipboard.writeText(texto);
}
catch(e){

    // Segundo intento (método clásico)
    const area=document.createElement("textarea");
    area.value=texto;
    document.body.appendChild(area);

    area.select();
    area.setSelectionRange(0,999999);

    document.execCommand("copy");

    document.body.removeChild(area);
}

boton.innerHTML="✅ ¡Mensaje copiado!";

setTimeout(()=>{
boton.innerHTML="📋 Copiar mensaje";
},2000);

}catch(error){

boton.innerHTML="❌ Error";

setTimeout(()=>{
boton.innerHTML="📋 Copiar mensaje";
},2000);

}

}

</script>
