<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Centro de Formación J.O.</title>
<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f5ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.tarjeta{
    background:white;
    width:340px;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    color:#7B5CFA;
    margin-top:0;
}

button{
    background:#7B5CFA;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

</style>
</head>

<body>

<div class="tarjeta">

<h1>Centro de Formación J.O.</h1>

<p>Si puedes leer esto, significa que tu aplicación ya está funcionando correctamente.</p>

<button>Primer botón</button>

</div>

</body>
</html>
