<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Respuesta Rápida - WhatsApp</title>

<style>

body{
    margin:0;
    background:#f7f5ff;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.tarjeta{
    background:white;
    width:340px;
    border-radius:18px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    color:#7B5CFA;
    margin-top:0;
    margin-bottom:15px;
}

.subtitulo{
    font-weight:bold;
    color:#5a5a5a;
    margin-bottom:15px;
    line-height:1.5;
}

.descripcion{
    text-align:left;
    line-height:1.7;
    margin-bottom:25px;
}

.descripcion ul{
    padding-left:18px;
    margin:10px 0 0;
}

button{
    width:100%;
    background:#7B5CFA;
    color:white;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    cursor:pointer;
    margin-top:12px;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}

</style>

</head>

<body>

<div class="tarjeta">

<h2>📱 WhatsApp</h2>

<div class="subtitulo">
💡 Utilízala cuando el cliente:
</div>

<div class="descripcion">

<ul>
<li>Pregunte si todo el trabajo es por WhatsApp.</li>
<li>Pregunte cómo se realiza la actividad.</li>
<li>Quiera saber cómo será su trabajo.</li>
</ul>

</div>

<button onclick="copiarAtajo()" id="btn1">
📋 Copiar atajo
</button>

<button onclick="copiarRespuesta()" id="btn2">
💬 Copiar respuesta
</button>

</div>

<script>

async function copiar(url,boton,textoFinal){

try{

const respuesta=await fetch(url);

const texto=await respuesta.text();

try{
await navigator.clipboard.writeText(texto);
}catch{

const area=document.createElement("textarea");

area.value=texto;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

document.body.removeChild(area);

}

boton.innerHTML=textoFinal;

setTimeout(()=>{

if(textoFinal.includes("Atajo"))
boton.innerHTML="📋 Copiar atajo";
else
boton.innerHTML="💬 Copiar respuesta";

},2000);

}catch{

boton.innerHTML="❌ Error";

setTimeout(()=>{

if(textoFinal.includes("Atajo"))
boton.innerHTML="📋 Copiar atajo";
else
boton.innerHTML="💬 Copiar respuesta";

},2000);

}

}

function copiarAtajo(){

copiar(

"https://raw.githubusercontent.com/JuliethOlaya/centro-formacion-jo/main/whatsapp-atajo.txt",

document.getElementById("btn1"),

"✅ Atajo copiado"

);

}

function copiarRespuesta(){

copiar(

"https://raw.githubusercontent.com/JuliethOlaya/centro-formacion-jo/main/whatsapp-respuesta.txt",

document.getElementById("btn2"),

"✅ Respuesta copiada"

);

}

</script>

</body>
</html>
