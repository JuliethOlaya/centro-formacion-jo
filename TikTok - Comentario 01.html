<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TikTok - Comentario 01</title>
<script>
function copiarTexto() {
    const texto = `Te paso todo en mi perfil o al privado`;
    navigator.clipboard.writeText(texto).then(function() {
        document.getElementById("mensaje").style.display = "block";
    });
}
</script>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}
button{
    padding:15px 28px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#6F4EF6;
    color:white;
}
#mensaje{
    display:none;
    margin-top:20px;
    color:#28a745;
    font-weight:bold;
    text-align:center;
}
</style>

</head>

<body>

<div align="center">

<button onclick="copiarTexto()">
Copiar texto
</button>

<div id="mensaje">
✅ Texto copiado correctamente.
</div>

</div>

</body>
</html>
