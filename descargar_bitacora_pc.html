<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    padding: 15px;
    background: transparent;
    font-family: Arial, sans-serif;
}

.tarjeta {
    max-width: 420px;
    margin: auto;
    padding: 24px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.12);
    text-align: center;
    border: 1px solid #eeeeee;
}

.icono {
    font-size: 38px;
    margin-bottom: 10px;
}

.titulo {
    font-size: 22px;
    font-weight: bold;
    color: #222222;
    margin-bottom: 10px;
}

.descripcion {
    font-size: 15px;
    line-height: 1.5;
    color: #666666;
    margin-bottom: 20px;
}

.boton {
    display: inline-block;
    padding: 13px 24px;
    background: #1f6feb;
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    border-radius: 10px;
    transition: 0.2s;
}

.boton:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.18);
}

</style>
</head>

<body>

<div class="tarjeta">

    <div class="icono">💻</div>

    <div class="titulo">
        Bitácora para computador
    </div>

    <div class="descripcion">
        Descarga la versión de la bitácora diseñada para utilizar desde tu computador.
    </div>

    <a 
        class="boton"
        href="https://julietholaya.github.io/centro-formacion-jo/BITACORA%20TU%20ALIANZA%20HOGAR.xlsm"
        download="BITACORA TU ALIANZA HOGAR.xlsm"
    >
        ⬇️ Descargar aquí
    </a>

</div>

</body>
</html>
