<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Respuesta Rápida - TikTok</title>

<style>

body{
    margin:0;
    background:#f7f5ff;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.tarjeta{
    background:white;
    width:340px;
    border-radius:18px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{
    color:#7B5CFA;
    margin-top:0;
    margin-bottom:15px;
}

.subtitulo{
    font-weight:bold;
    color:#5a5a5a;
    margin-bottom:15px;
    line-height:1.5;
}

.descripcion{
    text-align:left;
    line-height:1.6;
    margin-bottom:25px;
}

button{
    width:100%;
    background:#7B5CFA;
    color:white;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    cursor:pointer;
    margin-top:12px;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}

</style>

</head>

<body>

<div class="tarjeta">

<h2>💬 Comentarios TikTok</h2>

<div class="subtitulo">
💡 Utilízalo cuando una persona comente una de tus publicaciones.
</div>

<div class="descripcion">
Este mensaje es corto para responder comentarios dentro de TikTok y dirigir a la persona hacia tu perfil o al chat privado.
</div>

<button onclick="copiarRespuesta()" id="btn1">
📋 Copiar texto
</button>

</div>

<script>

async function copiar(url,boton,textoFinal){

try{

const respuesta=await fetch(url);

const texto=await respuesta.text();

try{

await navigator.clipboard.writeText(texto);

}catch{

const area=document.createElement("textarea");

area.value=texto;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

document.body.removeChild(area);

}

boton.innerHTML=textoFinal;

setTimeout(()=>{

boton.innerHTML="📋 Copiar texto";

},2000);

}catch{

boton.innerHTML="❌ Error";

setTimeout(()=>{

boton.innerHTML="📋 Copiar texto";

},2000);

}

}

function copiarRespuesta(){

copiar(

"https://raw.githubusercontent.com/JuliethOlaya/centro-formacion-jo/main/tiktok-comentario-01.txt",

document.getElementById("btn1"),

"✅ Texto copiado"

);

}

</script>

</body>
</html>
