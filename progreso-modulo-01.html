<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Progreso - Módulo 1</title>

<style>

body{
    margin:0;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.progreso{
    width:340px;
    box-sizing:border-box;
    background:white;
    border-radius:16px;
    padding:16px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.encabezado{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.titulo{
    font-size:14px;
    font-weight:bold;
    color:#555;
}

.modulo{
    font-size:13px;
    font-weight:bold;
    color:#7B5CFA;
}

.barra{
    width:100%;
    height:8px;
    background:#eeeafa;
    border-radius:20px;
    overflow:hidden;
}

.progreso-barra{
    width:20%;
    height:100%;
    background:#7B5CFA;
    border-radius:20px;
}

.pie{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:9px;
}

.mensaje{
    font-size:12px;
    color:#777;
}

.porcentaje{
    font-size:12px;
    font-weight:bold;
    color:#7B5CFA;
}

</style>

</head>

<body>

<div class="progreso">

    <div class="encabezado">

        <div class="titulo">
            🎯 Tu progreso
        </div>

        <div class="modulo">
            Módulo 1 de 5
        </div>

    </div>

    <div class="barra">

        <div class="progreso-barra"></div>

    </div>

    <div class="pie">

        <div class="mensaje">
            🌱 ¡Buen comienzo!
        </div>

        <div class="porcentaje">
            20%
        </div>

    </div>

</div>

</body>

</html>
