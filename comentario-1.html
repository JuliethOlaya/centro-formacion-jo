<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Texto para copiar</title>
<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f5f5f5;
font-family:Arial,sans-serif;
}
button{
padding:16px 28px;
font-size:18px;
border:none;
border-radius:12px;
background:#8e44ad;
color:white;
cursor:pointer;
transition:.3s;
}
button:hover{
background:#732d91;
}
#mensaje{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#333;
color:#fff;
padding:10px 18px;
border-radius:8px;
display:none;
font-size:15px;
}
</style>
</head>
<body>

<button onclick="copiarTexto()">
Copiar texto
</button>

<div id="mensaje">
✅ Texto copiado
</div>

<script>
function copiarTexto(){

const texto=`Hola, claro que si, ve a mi perfil o al privado`;

navigator.clipboard.writeText(texto).then(()=>{
const aviso=document.getElementById("mensaje");
aviso.style.display="block";
setTimeout(()=>{
aviso.style.display="none";
},1800);
});

}
</script>

</body>
</html>
